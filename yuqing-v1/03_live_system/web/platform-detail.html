<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平台舆情量详情</title>
  <style>
    :root{font-family:"Microsoft YaHei UI","PingFang SC",Arial,sans-serif;color:#eef8ff;background:#071624;--muted:#9cc9df;--line:rgba(119,190,226,.24);--cyan:#38bde8;--hot:#eecb72}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#06121f,#0a1d2d 52%,#071624)}
    .page{max-width:1500px;margin:0 auto;padding:22px 28px 32px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:16px}
    h1{margin:0;font-size:24px}.back{color:#cdeeff;text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:6px}.back:hover{color:var(--hot);border-color:var(--hot)}
    .sub{color:var(--muted);font-size:12px;margin:8px 0 18px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
    .card,.panel{border:1px solid var(--line);background:rgba(12,32,49,.78);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 28px rgba(0,0,0,.18)}
    .card{padding:12px 14px}.card span{display:block;color:var(--muted);font-size:12px}.card b{display:block;font-size:24px;margin-top:5px;color:#fff}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px}.panel{padding:14px;min-width:0}.panel h2{font-size:15px;margin:0 0 10px}.chart{height:560px}
    .table-wrap{overflow:auto;max-height:600px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 8px;border-bottom:1px solid rgba(119,190,226,.13);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:500;position:sticky;top:0;background:#0d2a40}td b{color:#fff}td.hot{color:var(--hot)}
    .empty{padding:30px;text-align:center;color:var(--muted)}.error{color:#ff9c92;padding:20px}
    @media(max-width:900px){.page{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.chart{height:420px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><div><h1>平台舆情量详情</h1><div class="sub" id="updated">正在读取后端真实数据…</div></div><a class="back" href="index.html">返回大屏</a></header>
    <section class="cards" id="cards"></section>
    <section class="grid">
      <section class="panel"><h2>平台舆情量排行</h2><div id="platformChart" class="chart"></div></section>
      <section class="panel"><h2>全部平台统计</h2><div class="table-wrap"><table><thead><tr><th>平台</th><th>舆情量</th><th>占总量</th><th>支持</th><th>非支持</th><th>支持率</th></tr></thead><tbody id="rows"></tbody></table></div></section>
    </section>
  </main>
  <script src="assets/echarts.min.js"></script>
  <script>
    const $=id=>document.getElementById(id);
    const fmt=n=>Number(n||0).toLocaleString("zh-CN");
    const pct=(a,b)=>b?((Number(a||0)/Number(b))*100).toFixed(1)+"%":"0%";
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function render(d){
      const rows=[...(d.platforms||[])].map(p=>({...p,nonSupport:Number(p.nonSupport||0)})).sort((a,b)=>b.total-a.total);
      const total=Number(d.topStats?.totalOpinions||rows.reduce((s,r)=>s+Number(r.total||0),0));
      const support=rows.reduce((s,r)=>s+Number(r.support||0),0);
      const nonSupport=rows.reduce((s,r)=>s+Number(r.nonSupport||0),0);
      $("updated").textContent=`数据来源：/api/bootstrap · 更新时间：${d.generatedAt||"实时"}`;
      $("cards").innerHTML=[
        ["平台数量",rows.length],["平台舆情总量",total],["支持认可",support],["非支持/非肯定",nonSupport]
      ].map(([a,b])=>`<div class="card"><span>${a}</span><b>${fmt(b)}</b></div>`).join("");
      $("rows").innerHTML=rows.map(p=>`<tr><td><b>${esc(p.name||"未分类")}</b></td><td class="hot">${fmt(p.total)}</td><td>${pct(p.total,total)}</td><td>${fmt(p.support)}</td><td>${fmt(p.nonSupport)}</td><td>${pct(p.support,p.total)}</td></tr>`).join("");
      const chart=echarts.init($("platformChart"));
      const chartRows=rows.slice(0,20).reverse();
      chart.setOption({grid:{left:130,right:44,top:10,bottom:20},tooltip:{trigger:"axis"},xAxis:{type:"value",axisLabel:{color:"#9cc9df"},splitLine:{lineStyle:{color:"rgba(127,197,236,.1)"}}},yAxis:{type:"category",data:chartRows.map(p=>p.name),axisLabel:{color:"#d8f0ff",width:120,overflow:"truncate"}},series:[{type:"bar",data:chartRows.map(p=>p.total),barWidth:16,itemStyle:{color:"#38bde8"},label:{show:true,position:"right",color:"#fff",formatter:p=>fmt(p.value)}}]});
      window.addEventListener("resize",()=>chart.resize());
    }
    fetch("/api/bootstrap",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("API "+r.status);return r.json()}).then(render).catch(e=>{$("rows").innerHTML=`<tr><td colspan="6" class="error">详情数据加载失败：${esc(e.message)}</td></tr>`});
  </script>
</body>
</html>

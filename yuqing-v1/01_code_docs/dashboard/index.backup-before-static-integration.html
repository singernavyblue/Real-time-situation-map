<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民族网络舆情动态态势感知大屏</title>
<style>
:root{
  --bg0:#030a18;
  --panel:rgba(7,20,44,.84);
  --panel2:rgba(10,32,66,.66);
  --line:rgba(64,160,255,.30);
  --cyan:#37c7ff;
  --blue:#2e7fff;
  --gold:#ffd666;
  --red:#ff5f56;
  --txt:#eaf4ff;
  --txt2:#9fc3e8;
  --txt3:#6f93bd;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  color:var(--txt);
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(1200px 700px at 18% -10%, rgba(46,127,255,.16), transparent 60%),
    radial-gradient(1000px 600px at 85% 110%, rgba(255,94,58,.10), transparent 60%),
    linear-gradient(180deg, #050f24 0%, #04102a 45%, #041437 100%);
}
#app{
  display:flex;flex-direction:column;
  width:1920px;height:1080px;flex:none;
  padding:8px 14px;gap:8px;
  transform:scale(var(--app-scale,1));
}

/* ---------- 顶栏 ---------- */
header{
  position:relative;display:flex;align-items:center;justify-content:space-between;
  height:74px;padding:0 24px;flex:none;
  background:linear-gradient(180deg, rgba(13,40,82,.88), rgba(7,22,48,.4));
  border:1px solid var(--line);border-radius:8px;
  box-shadow:0 0 22px rgba(46,127,255,.16);
}
header::before{
  content:"";position:absolute;left:24px;right:24px;bottom:-1px;height:2px;
  background:linear-gradient(90deg, transparent, rgba(55,199,255,.8), rgba(255,214,102,.8), transparent);
}
.head-title{text-align:center;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
.head-title h1{
  font-size:30px;letter-spacing:7px;font-weight:700;white-space:nowrap;
  background:linear-gradient(180deg,#fff 20%,#ffe9a8 55%,#f7c45f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 22px rgba(255,214,102,.25);
}
.head-title .sub{font-size:13px;color:var(--txt2);letter-spacing:3px;margin-top:3px;}
.head-side{font-size:12px;color:var(--txt2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;min-width:200px;}
.head-side b{color:var(--gold);font-weight:600;}
.head-left{font-size:12px;color:var(--txt2);min-width:200px;}
.head-left b{color:var(--cyan);font-weight:600;}

/* ---------- KPI ---------- */
#kpi{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:84px;}
.kpi{
  position:relative;display:flex;flex-direction:column;justify-content:center;
  padding:8px 14px;border-radius:7px;overflow:hidden;min-width:0;
  background:linear-gradient(135deg, rgba(13,44,88,.88), rgba(7,26,56,.75));
  border:1px solid var(--line);
}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),transparent);}
.kpi .num{font-size:27px;font-weight:700;color:var(--accent);line-height:1.15;white-space:nowrap;}
.kpi .num small{font-size:14px;font-weight:600;margin-left:4px;color:var(--txt2);}
.kpi .lbl{font-size:12px;color:var(--txt2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .trend{position:absolute;right:12px;top:10px;font-size:11px;color:var(--gold);}

/* ---------- 地图主区 ---------- */
#mapBand{position:relative;flex:1;min-height:0;}
#map{position:absolute;inset:0;}
.map-chip{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:12px;padding:7px 16px;border-radius:6px;
  background:linear-gradient(90deg, rgba(5,16,38,.9), rgba(10,34,70,.85));
  border:1px solid rgba(64,160,255,.45);
  box-shadow:0 3px 14px rgba(0,0,0,.5);white-space:nowrap;
}
.map-chip .mc-title{font-size:15px;font-weight:700;letter-spacing:2px;color:var(--txt);}
.map-chip .mc-title i{display:inline-block;width:8px;height:8px;transform:rotate(45deg);background:var(--cyan);box-shadow:0 0 8px var(--cyan);margin-right:9px;}
.map-chip .mc-focus{font-size:13px;color:var(--gold);}
.map-chip .mc-focus small{color:var(--txt3);font-weight:400;}
.map-chip .mc-btn{
  padding:3px 12px;border-radius:4px;font-size:12px;cursor:pointer;color:var(--txt);
  background:rgba(55,199,255,.12);border:1px solid rgba(55,199,255,.45);transition:all .2s;
}
.map-chip .mc-btn:hover{background:rgba(55,199,255,.28);}
.map-legend{
  position:absolute;left:418px;bottom:16px;z-index:6;
  display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:5px;
  font-size:11px;color:var(--txt3);background:rgba(5,16,38,.72);border:1px solid rgba(64,160,255,.22);
}
.map-legend i{width:80px;height:7px;border-radius:3px;background:linear-gradient(90deg,#0b2a4a,#1fa8c8,#ffd666,#ff5f56);}
.region-card{
  position:absolute;right:404px;bottom:8px;z-index:6;width:310px;border-radius:7px;
  padding:6px 10px;
  background:linear-gradient(135deg, rgba(6,18,40,.92), rgba(12,38,76,.86));
  border:1px solid rgba(255,214,102,.45);
  box-shadow:0 4px 16px rgba(0,0,0,.55);
}
.region-card .rc-head{display:flex;align-items:center;gap:8px;}
.region-card .rc-name{font-size:14px;font-weight:700;color:var(--gold);}
.region-card .rc-total{font-size:10px;color:var(--txt2);}
.region-card .rc-total b{color:var(--cyan);font-size:13px;}
.region-card .rc-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-top:5px;}
.region-card .rc-cell{text-align:center;padding:3px 1px;border-radius:4px;background:rgba(8,26,54,.55);border:1px solid rgba(64,160,255,.18);}
.region-card .rc-cell em{font-style:normal;display:block;font-size:13px;font-weight:700;color:var(--cyan);line-height:1.2;}
.region-card .rc-cell span{font-size:9px;color:var(--txt2);}
.region-card .rc-att{margin-top:4px;font-size:10px;color:var(--txt);display:flex;align-items:center;gap:5px;}
.region-card .rc-att i{font-style:normal;padding:1px 8px;border-radius:8px;font-size:9px;font-weight:600;color:#04101f;}
.ripple-layer{position:absolute;inset:0;pointer-events:none;z-index:4;}
.ripple{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);}
.ripple::before,.ripple::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(255,207,95,.95);animation:ripplePulse 2.6s ease-out infinite;}
.ripple::after{animation-delay:1.3s;}
.ripple .core{position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle,#fff7d6 0%,#ffd666 55%,rgba(255,122,69,.9) 100%);box-shadow:0 0 10px rgba(255,214,102,.9);}
.ripple.hot{width:24px;height:24px;}
.ripple.hot::before,.ripple.hot::after{border-color:rgba(255,255,255,.95);border-width:2.5px;}
@keyframes ripplePulse{0%{transform:scale(.5);opacity:1;}100%{transform:scale(3);opacity:0;}}

/* ---------- 悬浮侧栏 ---------- */
.col{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;gap:8px;z-index:5;}
.col-left{left:0;width:392px;}
.col-right{right:0;width:404px;}
.panel{
  position:relative;display:flex;flex-direction:column;min-height:0;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:inset 0 0 26px rgba(20,70,150,.12), 0 4px 16px rgba(0,0,0,.45);
}
.panel .p-head{
  flex:none;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;
  border-bottom:1px solid rgba(64,160,255,.16);
}
.p-head .dot{width:8px;height:8px;transform:rotate(45deg);background:var(--cyan);box-shadow:0 0 8px var(--cyan);flex:none;}
.p-head h3{font-size:14px;font-weight:600;letter-spacing:2px;color:var(--txt);white-space:nowrap;}
.p-head .tag{margin-left:auto;font-size:11px;color:var(--txt2);display:flex;gap:6px;align-items:center;white-space:nowrap;}
.p-head .tag em{font-style:normal;color:var(--gold);}
.p-body{flex:1;min-height:0;position:relative;padding:8px;}

/* 平台面板 */
#platPanel{flex:2.2;}
#platChart{width:100%;height:46%;}
.plat-detail{margin-top:5px;border-radius:6px;padding:8px 10px;height:calc(54% - 5px);
  background:linear-gradient(135deg, rgba(55,199,255,.08), rgba(46,127,255,.03));
  border:1px solid rgba(55,199,255,.28);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.pd-head{display:flex;align-items:center;gap:8px;}
.pd-name{font-size:16px;font-weight:700;color:var(--gold);}
.pd-att{font-size:12px;color:#04101f;font-weight:600;padding:2px 10px;border-radius:10px;background:#37c7ff;margin-left:auto;white-space:nowrap;}
.pd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;}
.pd-cell{text-align:center;padding:4px 2px;border-radius:5px;background:rgba(8,26,54,.55);border:1px solid rgba(64,160,255,.18);}
.pd-cell em{font-style:normal;font-size:15px;font-weight:700;color:var(--cyan);display:block;line-height:1.15;}
.pd-cell span{font-size:10px;color:var(--txt2);}
.pd-quote-label{font-size:10px;color:var(--txt3);margin-top:8px;}
.pd-quotes{flex:1;display:flex;flex-direction:column;gap:4px;min-height:0;}
.pd-q{flex:1;display:flex;align-items:center;font-size:12px;color:var(--txt);line-height:1.6;padding:6px 10px;border-radius:5px;
  background:rgba(8,26,54,.5);border-left:2px solid rgba(55,199,255,.55);
  overflow:hidden;}
.pd-q b{color:var(--cyan);font-weight:600;margin-right:4px;}

/* 语言面板 */
#langPanel{flex:1.0;}
#langChart{width:100%;height:46%;}
.lang-spot{margin-top:5px;padding:5px 10px;border-radius:6px;height:calc(54% - 5px);
  background:linear-gradient(135deg, rgba(255,214,102,.08), rgba(46,127,255,.04));
  border:1px solid rgba(55,199,255,.26);transition:border-color .4s, background .4s;display:flex;flex-direction:column;}
.lang-spot.active{border-color:rgba(255,214,102,.75);background:linear-gradient(135deg, rgba(255,214,102,.10), rgba(255,94,58,.06));}
.lang-spot .ls-h{display:flex;align-items:baseline;gap:8px;}
.lang-spot .ls-lang{font-size:13px;font-weight:700;color:var(--gold);}
.lang-spot .ls-cnt{font-size:11px;color:var(--txt2);}
.lang-spot .ls-rec{font-size:10px;color:var(--txt);line-height:1.45;margin-top:3px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

/* 热点排行（紧凑） */
#rankPanel{flex:1.0;}
#rankPanel .p-body{display:flex;flex-direction:column;}
.rk-list{display:flex;flex-direction:column;gap:4px;}
.rk-list{flex:1;min-height:0;overflow-y:auto;gap:3px;}
.rk-item{display:flex;align-items:center;gap:6px;padding:1px 6px;border-radius:5px;cursor:pointer;
  background:rgba(10,32,66,.45);border:1px solid rgba(64,160,255,.16);transition:all .25s;}
.rk-item:hover,.rk-item.active{border-color:rgba(255,214,102,.7);background:linear-gradient(90deg, rgba(255,214,102,.10), rgba(46,127,255,.05));}
.rk-badge{flex:none;width:15px;height:15px;border-radius:3px;line-height:15px;text-align:center;font-size:9px;font-weight:700;color:#04101f;background:#37c7ff;}
.rk-badge.top{background:linear-gradient(135deg,#ffd666,#ff7a45);}
.rk-main{flex:1;min-width:0;}
.rk-name{font-size:10px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-name em{font-style:normal;color:var(--gold);font-weight:700;margin-left:5px;}
.rk-bar{height:3px;border-radius:2px;background:rgba(64,160,255,.14);margin-top:2px;overflow:hidden;}
.rk-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--gold));}
.rk-rate{flex:none;font-size:9px;color:var(--txt2);}
.rk-note{margin-top:4px;padding:3px 7px;border-radius:5px;font-size:9px;color:var(--txt3);
  background:rgba(8,26,54,.5);border:1px dashed rgba(64,160,255,.25);text-align:center;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 信息流 */
#streamPanel{flex:1.35;}
.stream-tools{display:flex;align-items:center;gap:6px;}
.stream-tools .chip{padding:2px 9px;font-size:11px;border-radius:11px;color:var(--txt2);
  background:rgba(55,199,255,.10);border:1px solid rgba(55,199,255,.35);white-space:nowrap;}
.stream-tools .chip b{color:var(--gold);font-weight:600;}
.stream-tools .clr{cursor:pointer;padding:2px 8px;border-radius:10px;font-size:11px;color:var(--cyan);border:1px solid rgba(55,199,255,.45);background:transparent;}
.stream-wrap{position:absolute;inset:38px 0 0 0;overflow:hidden;padding:0 4px;}
.stream-list{display:flex;flex-direction:column;gap:7px;padding:4px 7px 10px;transition:opacity .25s;}
.stream-list.fade{opacity:0;}
.stream-item{padding:7px 10px;border-radius:6px;flex:none;
  background:linear-gradient(90deg, rgba(15,46,92,.65), rgba(9,28,60,.35));
  border-left:3px solid var(--tag,#37c7ff);}
.stream-item .s-meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt2);}
.stream-item .s-plat{color:var(--cyan);font-weight:600;}
.stream-item .s-att{padding:1px 7px;border-radius:9px;font-size:10px;color:#04101f;font-weight:600;background:var(--tag,#37c7ff);}
.stream-item .s-time{margin-left:auto;color:var(--txt3);font-size:10px;}
.stream-item .s-txt{font-size:12px;line-height:1.55;margin-top:4px;color:var(--txt);}
@keyframes streamScroll{from{transform:translateY(0);}to{transform:translateY(-50%);}}
.stream-list.anim{animation:streamScroll linear infinite;}

/* 少语聚焦 */
#langFocusPanel{flex:1.0;}
#langPanel{flex:.95;}
.focus-cards{display:flex;flex-direction:column;gap:4px;height:100%;}
.fc{padding:3px 8px;border-radius:6px;cursor:pointer;
  background:rgba(10,32,66,.5);border:1px solid rgba(64,160,255,.2);transition:all .3s;}
.fc.active{border-color:rgba(255,214,102,.8);background:linear-gradient(135deg, rgba(255,214,102,.10), rgba(46,127,255,.06));}
.fc .fc-h{display:flex;align-items:center;gap:8px;font-size:11px;}
.fc .fc-lang{font-weight:700;color:var(--gold);}
.fc .fc-cnt{font-size:10px;color:var(--txt3);margin-left:auto;}
.fc .fc-rec{font-size:9.5px;color:var(--txt);line-height:1.35;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.lang-summary{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:2px 8px;border-radius:5px;font-size:9px;color:var(--txt2);
  background:rgba(10,32,66,.45);border:1px solid rgba(64,160,255,.18);}
.lang-summary b{color:var(--gold);font-weight:700;}

/* ---------- 底部 ---------- */
#bottom{flex:none;display:grid;grid-template-columns:1fr 1fr 1.18fr;gap:8px;height:196px;}
.bpanel{display:flex;flex-direction:column;border-radius:8px;background:var(--panel);border:1px solid var(--line);min-width:0;}
.bpanel .p-head{flex:none;height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgba(64,160,255,.16);}
.bpanel .p-body{flex:1;min-height:0;position:relative;padding:6px;}
.bpanel h3{font-size:13px;font-weight:600;letter-spacing:2px;}
.bchart{width:100%;height:100%;}
.trend-tools{display:flex;align-items:center;gap:6px;}
.trend-tools .tt-day{font-size:11px;color:var(--gold);}
.trend-tools .tt-btn{cursor:pointer;padding:2px 9px;border-radius:9px;font-size:11px;color:var(--cyan);border:1px solid rgba(55,199,255,.45);background:transparent;}

/* 传播概览 */
.hot-list{display:flex;flex-direction:column;gap:5px;}
.hot-item{display:flex;align-items:center;gap:7px;font-size:11px;padding:4px 7px;border-radius:5px;background:rgba(8,26,54,.5);}
.hot-item .rk{flex:none;width:16px;height:16px;border-radius:3px;text-align:center;line-height:16px;font-size:10px;font-weight:700;color:#04101f;background:#37c7ff;}
.hot-item .rk.hot{background:linear-gradient(135deg,#ffd666,#ff7a45);}
.hot-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt);}
.hot-item .pt{flex:none;color:var(--cyan);font-size:10px;}
.hot-item .lk{flex:none;color:var(--gold);font-weight:700;font-size:11px;}

.foot-note{
  flex:none;display:flex;align-items:center;justify-content:center;gap:24px;
  font-size:11px;color:var(--txt3);letter-spacing:1px;height:20px;white-space:nowrap;
}
.foot-note b{color:var(--txt2);font-weight:600;}
.scrollbar::-webkit-scrollbar{width:4px;}
.scrollbar::-webkit-scrollbar-thumb{background:rgba(55,199,255,.35);border-radius:2px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="head-title">
      <h1>民族网络舆情动态态势感知大屏</h1>
    </div>
    <div class="head-side">统计截止：<b>2026-08-05</b></div>
  </header>

  <div id="kpi"></div>

  <main id="mapBand">
    <div id="map"></div>
    <div class="ripple-layer" id="rippleLayer"></div>
    <div class="map-chip">
      <span class="mc-title"><i></i>全国舆情热力分布</span>
      <span class="mc-focus" id="mcFocus">总体态势</span>
      <button class="mc-btn" id="mcBtn">暂停轮播</button>
    </div>
    <div class="map-legend"><span>低</span><i></i><span>高</span></div>
    <div class="region-card" id="regionCard" style="display:none;"></div>

    <div class="col col-left">
      <div class="panel" id="platPanel">
        <div class="p-head"><span class="dot"></span><h3>平台分布</h3><div class="tag" id="platTag">自动轮播</div></div>
        <div class="p-body">
          <div id="platChart"></div>
          <div class="plat-detail">
            <div class="pd-head"><span class="pd-name" id="pdName">平台名称</span><span class="pd-att" id="pdAtt">态度</span></div>
            <div class="pd-grid">
              <div class="pd-cell"><em id="pdCount">0</em><span>舆情数量</span></div>
              <div class="pd-cell"><em id="pdRate">0%</em><span>支持率</span></div>
              <div class="pd-cell"><em id="pdPct">0%</em><span>平台占比</span></div>
              <div class="pd-cell"><em id="pdNS">0</em><span>非支持</span></div>
            </div>
            <div class="pd-quotes"><div class="pd-quote-label">代表性发言</div><div class="pd-q" id="pdQ1"></div></div>
          </div>
        </div>
      </div>
      <div class="panel" id="rankPanel">
        <div class="p-head"><span class="dot"></span><h3>热点地区排行</h3><div class="tag">点击联动</div></div>
        <div class="p-body"><div class="rk-list" id="rankList"></div></div>
      </div>
    </div>

    <div class="col col-right">
      <div class="panel" id="streamPanel">
        <div class="p-head"><span class="dot"></span><h3>网络舆情信息流</h3>
          <div class="tag stream-tools">
            <span class="chip" id="cntChip">共 <b id="streamCnt"></b> 条</span>
            <span class="chip" id="streamChip" style="display:none"></span>
            <button class="clr" id="streamClr" style="display:none">恢复全部</button>
          </div>
        </div>
        <div class="stream-wrap"><div class="stream-list" id="streamList"></div></div>
      </div>
      <div class="panel" id="langFocusPanel">
        <div class="p-head"><span class="dot"></span><h3>少数民族语言声音聚焦</h3><div class="tag">真实监测记录</div></div>
        <div class="p-body" style="display:flex;flex-direction:column;gap:6px;">
          <div class="focus-cards" id="focusCards"></div>
          <div class="lang-summary">中文/普通话 <b id="zhCount"></b> 条 · 维吾尔语/文 <b id="uyCount"></b> · 彝语/文 <b id="yiCount"></b>（平台维度）</div>
        </div>
      </div>
      <div class="panel" id="langPanel">
        <div class="p-head"><span class="dot"></span><h3>语言分布</h3><div class="tag">平台维度</div></div>
        <div class="p-body">
          <div id="langChart"></div>
          <div class="lang-spot" id="langSpot">
            <div class="ls-h"><span class="ls-lang" id="lsLang"></span><span class="ls-cnt" id="lsCnt"></span></div>
            <div class="ls-rec" id="lsRec"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="bottom">
    <div class="bpanel">
      <div class="p-head"><span class="dot"></span><h3>总体态度</h3><div class="tag" id="attTag">全国总体视角</div></div>
      <div class="p-body"><div id="attChart" class="bchart"></div></div>
    </div>
    <div class="bpanel">
      <div class="p-head"><span class="dot"></span><h3>非支持问题构成</h3><div class="tag" id="nsTag">全国 305 条</div></div>
      <div class="p-body"><div id="nsChart" class="bchart"></div></div>
    </div>
    <div class="bpanel">
      <div class="p-head"><span class="dot"></span><h3>舆情时间趋势</h3>
        <div class="tag trend-tools">
          <span class="tt-day" id="trendDay"></span>
          <button class="tt-btn" id="trendPlay">▶ 播放时间轴</button>
        </div>
      </div>
      <div class="p-body"><div id="trendChart" class="bchart"></div></div>
    </div>
  </div>

</div>

<script src="assets/echarts.min.js"></script>
<script src="assets/china.js"></script>
<script src="assets/data.js"></script>
<script>
(function(){
  const D = window.DASH_DATA;
  const $ = id => document.getElementById(id);
  const fmt = n => (n==null?"—":Number(n).toLocaleString("zh-CN"));
  const pct = (a,b) => b ? (a/b*100).toFixed(1)+"%" : "0%";

  echarts.registerMap("china_main", window.CHINA_GEO);
  echarts.registerMap("china_nanhai", window.NANHAI_GEO);

  const ATT_COLORS = {
    "支持认可":"#ffd666","中性信息":"#6f9cc8","咨询疑问":"#f2b64c","担忧影响":"#f2924c",
    "明确批评":"#ff5f56","投诉维权":"#d93a5c","实施问题":"#e8683a","公平争议":"#c77bff",
    "歧视偏见":"#ff4d8f","参与建议":"#4cd9a8","不了解该法律":"#8fa8c9","其他/未分类":"#8fa8c9","待核实":"#b0b8cc",
    "问题型/非支持":"#ff7a45","其他/待分类":"#8fa8c9"
  };
  const PLAT_KEYS = {
    "抖音等视频平台":["抖音"],
    "微博/热榜":["微博"],
    "快手":["快手"],
    "小红书/豆瓣等平台":["小红书","豆瓣"],
    "知乎/B站/百度知道":["知乎","哔哩哔哩","百度知道","B站","B 站"],
    "贴吧/头条/新闻评论":["贴吧","头条","新闻"],
    "微信公众号/视频号":["微信","公众号","视频号"]
  };
  const REGION_PLAT = {
    "四川、甘肃民族地区":"快手",
    "内蒙古、河北及东北":"抖音等视频平台",
    "新疆":"微信公众号/视频号"
  };

  // ---------- KPI ----------
  const T = D.topStats;
  const kpiDefs = [
    {k:"totalOpinions",l:"平台维度公众意见总量",color:"#37c7ff",s:"条"},
    {k:"regionOpinions",l:"可明确归属地区的公众意见",color:"#2e7fff",s:"条"},
    {k:"supportCount",l:"支持认可意见（平台维度）",color:"#ffd666",s:"条",extra:pct(T.supportCount,T.totalOpinions)},
    {k:"nonSupport",l:"非支持/非肯定态度",color:"#ff5f56",s:"条"},
    {k:"monitorSources",l:"监测来源数",color:"#4cd9a8",s:"个"},
    {k:"viewedInfo",l:"查看信息数",color:"#c77bff",s:"条"}
  ];
  const kpiBox = $("kpi");
  kpiDefs.forEach(d=>{
    const div=document.createElement("div");
    div.className="kpi";div.style.setProperty("--accent",d.color);
    div.innerHTML=`<div class="num" data-v="${T[d.k]}">0<small>${d.s}</small></div><div class="lbl">${d.l}</div>${d.extra?`<div class="trend">${d.extra}</div>`:""}`;
    kpiBox.appendChild(div);
  });
  function countUp(){
    document.querySelectorAll(".kpi .num").forEach(el=>{
      const target=+el.dataset.v,t0=performance.now(),dur=1300;
      (function tick(t){
        const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);
        el.firstChild.textContent=fmt(Math.round(target*e));
        if(p<1)requestAnimationFrame(tick);
      })(t0);
    });
  }

  // ---------- 地图（主图 + 南海插图） ----------
  const provVal = new Map(D.provinces.map(p=>[p.name,p.value]));
  const provGroups = new Map(D.provinces.map(p=>[p.name,p.groups]));
  const groupMap = new Map(D.regions.map(g=>[g.name,g]));
  const mapData = D.provinces.map(p=>({name:p.name,value:p.value}));
  const centroids = {};
  window.CHINA_GEO.features.forEach(f=>{
    const p=f.properties;
    if(p.centroid){ centroids[p.name]=p.centroid; return; }
    // 兜底：要素包围盒中心
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    const coords=f.geometry.coordinates;
    const polys=coords;
    for(const poly of polys){
      const rings=(poly&&Array.isArray(poly[0])&&Array.isArray(poly[0][0]))?poly:[poly];
      for(const ring of rings){
        for(const pt of ring){
          if(pt[0]<minx)minx=pt[0]; if(pt[0]>maxx)maxx=pt[0];
          if(pt[1]<miny)miny=pt[1]; if(pt[1]>maxy)maxy=pt[1];
        }
      }
    }
    if(maxx>-1e9)centroids[p.name]=[(minx+maxx)/2,(miny+maxy)/2];
  });

  const mapChart = echarts.init($("map"));
  const hotProvinces = D.provinces.filter(p=>p.value>0).sort((a,b)=>b.value-a.value).slice(0,7);
  const mapMax = Math.max(...mapData.map(d=>d.value),10);
  const monitoredSet = new Set(D.provinces.map(p=>p.name));

  const mapOpt = {
    backgroundColor:"transparent",
    tooltip:{
      trigger:"item",backgroundColor:"rgba(4,14,34,.93)",borderColor:"rgba(64,160,255,.5)",
      textStyle:{color:"#eaf4ff",fontSize:13},confine:true,
      formatter:function(p){
        if(p.seriesType!=="map"||p.seriesIndex!==0)return "";
        const groups=provGroups.get(p.name)||[];
        if(!groups.length)return `<b>${p.name}</b><br>本期未纳入地区监测统计`;
        const val=provVal.get(p.name)||0;
        const gtxt=groups.map(g=>`${g.group} ${g.total}条`).join("<br>");
        return `<b>${p.name}</b><br>公众意见：<b style="color:#ffd666">${fmt(val)}</b> 条${val>0?`<br>（${gtxt}）`:""}`;
      }
    },
    visualMap:{
      type:"piecewise",show:false,seriesIndex:0,
      pieces:[
        {min:501,color:"#ff8570"},
        {min:201,max:500,color:"#ea5a4e"},
        {min:101,max:200,color:"#cc3a40"},
        {min:31,max:100,color:"#a02834"},
        {min:1,max:30,color:"#79212e"},
        {value:0,color:"#571b26"}
      ]
    },
    series:[
      {
        id:"map_main",name:"舆情热度",type:"map",map:"china_main",roam:false,aspectScale:1.08,
        layoutCenter:[946,318],layoutSize:1110,
        label:{
          show:true,fontSize:10,color:"#eaf6ff",
          textShadowColor:"rgba(0,0,0,.85)",textShadowBlur:3,textShadowOffsetY:1,
          formatter:function(p){
            if(!monitoredSet.has(p.name))return "";
            if(p.value>0)return p.value;
            return "0";
          }
        },
        labelLayout:{dy:-14},
        emphasis:{label:{show:true,color:"#fff",fontSize:13,fontWeight:"bold"},
          itemStyle:{areaColor:"#ff9a3d",borderColor:"#fff6d8",borderWidth:2,shadowBlur:20,shadowColor:"rgba(255,180,80,.85)"}},
        select:{disabled:true},
        itemStyle:{areaColor:"#183257",borderColor:"#3d6ea8",borderWidth:.8},
        data:mapData
      },
      {
        id:"map_nanhai",name:"南海诸岛",type:"map",map:"china_nanhai",roam:false,aspectScale:.95,
        layoutCenter:["75%","70%"],layoutSize:"20%",silent:true,
        itemStyle:{areaColor:"#163a66",borderColor:"#5aa3e0",borderWidth:1.5},
        data:[{name:"南海诸岛",value:0}]
      }
    ]
  };
  try{ mapChart.setOption(mapOpt); }catch(e){ console.error("MAP_INIT_SET", e.message); }

  // 南海诸岛插图：规范虚线框 + 标注
  function updateNanhaiBox(){
    try{
      const tl = mapChart.convertToPixel({seriesIndex:1}, [108.2, 24.6]);
      const br = mapChart.convertToPixel({seriesIndex:1}, [122.8, 3.4]);
      let x1,y1,x2,y2;
      if(tl&&br&&!isNaN(tl[0])&&!isNaN(br[0])&&tl[0]>0&&tl[1]>0){
        x1=Math.min(tl[0],br[0]); x2=Math.max(tl[0],br[0]);
        y1=Math.min(tl[1],br[1]); y2=Math.max(tl[1],br[1]);
      }else{
        const size=0.22*Math.min(1892,602);
        const w=size*0.655, h=size;
        x1=1419-w/2; x2=1419+w/2; y1=439.5-h/2; y2=439.5+h/2;
      }
      const pad=9;
      mapChart.setOption({
        graphic:[
          {type:"rect",shape:{x:x1-pad,y:y1-pad,width:x2-x1+pad*2,height:y2-y1+pad*2},
           style:{stroke:"rgba(90,163,224,.95)",lineWidth:1.5,lineDash:[7,5],fill:"rgba(22,58,102,.10)"},
           silent:true,z:10},
          {type:"text",left:(x1+x2)/2,top:y2+pad-1,
           style:{text:"南海诸岛",textAlign:"center",fill:"#9fd0ff",fontSize:12,fontWeight:"bold"},
           silent:true,z:10}
        ]
      });
    }catch(e){ console.error("NANHAI_BOX_FAIL",e.message); }
  }
  updateNanhaiBox();

  // DOM 呼吸点（基于地图系列自身坐标转换，保证与渲染一致）
  const rippleLayer = $("rippleLayer");
  function renderRipples(){
    rippleLayer.innerHTML="";
    hotProvinces.forEach(p=>{
      const c=centroids[p.name]; if(!c)return;
      const pt=mapChart.convertToPixel({seriesIndex:0},[c[0],c[1]]);
      if(!pt||pt[0]<0||pt[1]<0||pt[0]>rippleLayer.clientWidth||pt[1]>rippleLayer.clientHeight)return;
      const d=document.createElement("div");
      d.className="ripple"; d.dataset.prov=p.name;
      // 呼吸点精确置于省份质心；数字标注已上移，互不遮挡
      d.style.left=pt[0]+"px"; d.style.top=pt[1]+"px";
      d.innerHTML='<span class="core"></span>';
      rippleLayer.appendChild(d);
    });
  }
  renderRipples();
  function applyMapHighlight(name){
    try{ mapChart.dispatchAction({type:"downplay",seriesIndex:0}); }catch(e){}
    if(name){ try{ mapChart.dispatchAction({type:"highlight",seriesIndex:0,name}); }catch(e){} }
    document.querySelectorAll(".ripple").forEach(el=>{
      el.classList.toggle("hot",!!name&&el.dataset.prov===name);
    });
  }

  // ---------- 平台图 + 详情卡 ----------
  const platChart = echarts.init($("platChart"));
  const platSorted=[...D.platforms].sort((a,b)=>b.total-a.total);
  function platStackData(){
    return platSorted.map(p=>({
      name:p.name,
      value:[p.support, p.total-p.support-(p.neutral||0)-(p.suggest||0), (p.neutral||0)+(p.suggest||0)]
    }));
  }
  try{ platChart.setOption({
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"},backgroundColor:"rgba(4,14,34,.93)",borderColor:"rgba(64,160,255,.5)",textStyle:{color:"#eaf4ff",fontSize:12},
      formatter:ps=>{
        const p=D.platforms.find(x=>x.name===ps[0].name);
        return `<b>${p.name}</b><br>公众意见：${fmt(p.total)} 条（${pct(p.total,T.totalOpinions)}）<br>支持认可：${fmt(p.support)}（${p.supportRate}%）<br>非支持/非肯定：${fmt(p.total-p.support-(p.neutral||0)-(p.suggest||0))} 条`;
      }},
    legend:{show:false},
    grid:{left:8,right:112,top:12,bottom:6,containLabel:true},
    xAxis:{type:"value",stack:"t",splitLine:{lineStyle:{color:"rgba(64,160,255,.10)"}},axisLabel:{color:"#7fa8cf",fontSize:10}},
    yAxis:{type:"category",data:platSorted.map(p=>p.name),axisLine:{lineStyle:{color:"rgba(64,160,255,.3)"}},axisLabel:{color:"#cfe6ff",fontSize:11},inverse:true},
    series:[
      {name:"支持",type:"bar",stack:"t",data:platStackData().map(d=>d.value[0]),barWidth:12,
        itemStyle:{color:"#f5b84d",borderRadius:[0,0,0,0]}},
      {name:"非支持",type:"bar",stack:"t",data:platStackData().map(d=>d.value[1]),barWidth:12,
        itemStyle:{color:"#ff5f56",borderRadius:[0,4,4,0]}},
      {name:"中性/建议",type:"bar",stack:"t",data:platStackData().map(d=>d.value[2]),barWidth:12,
        itemStyle:{color:"#3f6f9f"}},
      {name:"占比",type:"bar",data:platSorted.map(p=>p.total),barWidth:12,
        label:{show:true,position:"right",color:"#ffd666",fontSize:10,
          formatter:({dataIndex})=>fmt(platSorted[dataIndex].total)+" · "+pct(platSorted[dataIndex].total,T.totalOpinions)},
        itemStyle:{color:"transparent"},z:5,silent:true}
    ]
  }); }catch(e){ console.error("PLAT_SET", e.message); }
  function platDetail(p){
    const keys=PLAT_KEYS[p.name]||[p.name];
    let pool=D.quotes.filter(q=>keys.some(k=>q.platform&&q.platform.includes(k)));
    const prefer=/非支持来源与原话|快手平台|抖音等视频平台|微博热榜平台|四川甘肃|15地区微信/;
    let qs=pool.filter(q=>prefer.test(q.src||""));
    if(qs.length<2)qs=pool;
    qs=qs.sort((a,b)=>b.text.length-a.text.length).slice(0,2);
    $("pdName").textContent=p.name;
    $("pdCount").textContent=fmt(p.total);
    $("pdRate").textContent=p.supportRate+"%";
    $("pdPct").textContent=pct(p.total,T.totalOpinions);
    $("pdNS").textContent=fmt(p.total-p.support-(p.neutral||0)-(p.suggest||0));
    const topAtt = Object.entries({
      支持认可:p.support,中性信息:p.neutral||0,咨询疑问:p.qa||0,担忧影响:p.worry||0,
      明确批评:p.criticism||0,投诉维权:p.complaint||0,实施问题:p.implement||0,
      公平争议:p.fairness||0,歧视偏见:p.discrimination||0,参与建议:p.suggest||0,不了解该法律:p.unknownLaw||0
    }).sort((a,b)=>b[1]-a[1])[0];
    $("pdAtt").textContent=`主要态度：${topAtt[0]}`;
    $("pdAtt").style.background=ATT_COLORS[topAtt[0]]||"#37c7ff";
    if(qs[0]){
      let t=qs[0].text;
      if(t.length>110)t=t.slice(0,110)+"…";
      $("pdQ1").innerHTML=`<b>${qs[0].region||"全国"}</b>${t}`;
    }else{
      $("pdQ1").innerHTML="";
    }
  }
  platDetail(platSorted[0]);
  function highlightPlat(name){
    try{ platChart.dispatchAction({type:"downplay",seriesIndex:0}); }catch(e){}
    try{ platChart.dispatchAction({type:"downplay",seriesIndex:1}); }catch(e){}
    try{ platChart.dispatchAction({type:"downplay",seriesIndex:2}); }catch(e){}
    if(name){
      const p=D.platforms.find(x=>x.name===name);
      if(!p)return;
      platDetail(p);
      $("platTag").textContent=`当前平台：${name}`;
      try{ platChart.dispatchAction({type:"highlight",seriesIndex:0,name}); }catch(e){}
    }else{
      $("platTag").textContent="自动轮播";
    }
  }

  // ---------- 语言图 + 聚焦 ----------
  const langChart = echarts.init($("langChart"));
  const langData=D.languagePlatform.map(l=>({name:l.name.replace("（含原未标注语言）",""),value:l.value}));
  try{ langChart.setOption({
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"},backgroundColor:"rgba(4,14,34,.93)",borderColor:"rgba(64,160,255,.5)",textStyle:{color:"#eaf4ff",fontSize:12}},
    grid:{left:8,right:50,top:8,bottom:6,containLabel:true},
    xAxis:{type:"value",splitLine:{lineStyle:{color:"rgba(64,160,255,.10)"}},axisLabel:{color:"#7fa8cf",fontSize:10}},
    yAxis:{type:"category",data:langData.map(l=>l.name),axisLine:{lineStyle:{color:"rgba(64,160,255,.3)"}},axisLabel:{color:"#cfe6ff",fontSize:11},inverse:true},
    series:[{type:"bar",data:langData.map(l=>l.value),barWidth:11,
      itemStyle:{borderRadius:[0,5,5,0],color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:"#7a4f9f"},{offset:1,color:"#c77bff"}])},
      label:{show:true,position:"right",color:"#ffd666",fontSize:10,formatter:({value})=>fmt(value)}}]
  }); }catch(e){ console.error("LANG_SET", e.message); }
  function highlightLang(name){
    try{ langChart.dispatchAction({type:"downplay",seriesIndex:0}); }catch(e){}
    if(name){ try{ langChart.dispatchAction({type:"highlight",seriesIndex:0,name}); }catch(e){} }
  }
  const focusData = D.langSpotlight.filter(f=>f.lang!=="中文/普通话");
  const fcBox=$("focusCards");
  const langPlatMap = new Map(D.languagePlatform.map(l=>[l.name,l.value]));
  $("zhCount").textContent=fmt(langPlatMap.get("中文/普通话")||0);
  $("uyCount").textContent=fmt(langPlatMap.get("维吾尔语/文")||0);
  $("yiCount").textContent=fmt(langPlatMap.get("彝语/文")||0);
  focusData.forEach((f,i)=>{
    const div=document.createElement("div");
    div.className="fc"+(i===0?" active":"");
    div.innerHTML=`<div class="fc-h"><span class="fc-lang">${f.lang}</span><span class="fc-cnt">${f.count} 条</span></div><div class="fc-rec">${f.record}</div>`;
    div.onclick=()=>{ pinLang(f.lang,i); };
    fcBox.appendChild(div);
  });
  const langSpot={lang:$("lsLang"),cnt:$("lsCnt"),rec:$("lsRec")};
  function showLangSpot(i){
    const f=focusData[i%focusData.length];
    langSpot.lang.textContent=f.lang;
    langSpot.cnt.textContent=f.count+" 条";
    langSpot.rec.textContent=f.record;
    document.querySelectorAll(".fc").forEach((c,idx)=>c.classList.toggle("active",idx===i%focusData.length));
    $("langSpot").classList.add("active");
    highlightLang(f.lang.replace("（",""));
  }
  let langIdx=0;

  // ---------- 总体态度 / 非支持 ----------
  const attChart=echarts.init($("attChart"));
  const nsChart=echarts.init($("nsChart"));

  function attData(seg){
    const SUGGEST=(D.attitude.macro.find(m=>m.name==="参与建议")||{}).value||61;
    if(!seg)return {tag:"全国总体",rows:[
      {name:"支持认可",value:T.supportCount},
      {name:"中性信息",value:T.totalOpinions-T.supportCount-SUGGEST-305},
      {name:"参与建议",value:SUGGEST},
      {name:"非支持/非肯定",value:305}]};
    if(seg.type==="region"||seg.type==="province"){
      const g=seg.data;
      const issue=(g.qa||0)+(g.worry||0)+(g.criticism||0)+(g.complaint||0)+(g.implement||0)+(g.fairness||0)+(g.discrimination||0);
      const other=(g.pending||0)+(g.other||0);
      return {tag:seg.type==="province"?(g.short||g.name):g.name,rows:[
        {name:"支持认可",value:g.support||0},
        {name:"中性信息",value:g.neutral||0},
        {name:"问题型/非支持",value:issue},
        {name:"其他/待分类",value:other}]};
    }
    const p=seg.data;
    return {tag:p.name,rows:[
      {name:"支持认可",value:p.support},
      {name:"中性信息",value:p.neutral||0},
      {name:"参与建议",value:p.suggest||0},
      {name:"非支持/非肯定",value:p.total-p.support-(p.neutral||0)-(p.suggest||0)}]};
  }
  function renderAtt(seg){
    const r=attData(seg);
    $("attTag").textContent=seg?`当前视角：${r.tag}`:"全国总体视角";
    try{ attChart.setOption({
      tooltip:{trigger:"item",backgroundColor:"rgba(4,14,34,.93)",borderColor:"rgba(64,160,255,.5)",textStyle:{color:"#eaf4ff",fontSize:12},
        formatter:p=>`${p.name}<br><b style="color:#ffd666">${fmt(p.value)}</b> 条（${p.percent}%）`},
      grid:{left:8,right:34,top:16,bottom:6,containLabel:true},
      xAxis:{type:"value",max:"dataMax",splitLine:{lineStyle:{color:"rgba(64,160,255,.10)"}},axisLabel:{color:"#7fa8cf",fontSize:10}},
      yAxis:{type:"category",data:r.rows.map(d=>d.name),axisLine:{lineStyle:{color:"rgba(64,160,255,.3)"}},axisLabel:{color:"#cfe6ff",fontSize:11},inverse:true},
      series:[{type:"bar",data:r.rows.map(d=>({value:d.value,itemStyle:{color:ATT_COLORS[d.name]||"#37c7ff",borderRadius:[0,5,5,0]}})),barWidth:15,
        label:{show:true,position:"right",color:"#eaf4ff",fontSize:10,formatter:({value})=>fmt(value)}}]
    },{notMerge:true}); }catch(e){ console.error("ATT_SET", e.message); }
  }
  let attCyc=0;
  function attAutoHighlight(){
    try{
      const data=attChart.getOption().yAxis[0].data||[];
      if(!data.length)return;
      attCyc=attCyc%data.length;
      attChart.dispatchAction({type:"downplay",seriesIndex:0});
      attChart.dispatchAction({type:"highlight",seriesIndex:0,dataIndex:attCyc});
    }catch(e){ console.error("ATT_HL_FAIL",e.message); }
    attCyc++;
  }

  function nsData(seg){
    if(!seg)return {tag:"全国",rows:D.nonSupport.filter(n=>n.value>0)};
    const d=seg.data;
    const map={咨询疑问:"qa",担忧影响:"worry",明确批评:"criticism",投诉维权:"complaint",实施问题:"implement",公平争议:"fairness",歧视偏见:"discrimination"};
    return {tag:d.short||d.name||"",rows:NS_CATS.map(c=>({name:c,value:d[map[c]]||0})).filter(x=>x.value>0)};
  }
  const NS_CATS=["咨询疑问","担忧影响","明确批评","投诉维权","实施问题","公平争议","歧视偏见"];
  function renderNS(seg){
    const r=nsData(seg);
    $("nsTag").textContent=seg?`当前视角：${r.tag}`:`全国 ${T.nonSupport} 条`;
    try{ nsChart.setOption({
      tooltip:{trigger:"axis",axisPointer:{type:"shadow"},backgroundColor:"rgba(4,14,34,.93)",borderColor:"rgba(64,160,255,.5)",textStyle:{color:"#eaf4ff",fontSize:12},
        formatter:ps=>{const d=ps[0];return `<b>${d.name}</b><br>${fmt(d.value)} 条`;}},
      grid:{left:8,right:34,top:12,bottom:6,containLabel:true},
      xAxis:{type:"value",splitLine:{lineStyle:{color:"rgba(64,160,255,.10)"}},axisLabel:{color:"#7fa8cf",fontSize:10}},
      yAxis:{type:"category",data:r.rows.map(x=>x.name),axisLine:{lineStyle:{color:"rgba(64,160,255,.3)"}},axisLabel:{color:"#cfe6ff",fontSize:11},inverse:true},
      series:[{type:"bar",data:r.rows.map(x=>({value:x.value,itemStyle:{color:ATT_COLORS[x.name]||"#ff7a45",borderRadius:[0,5,5,0]}})),barWidth:13,
        label:{show:true,position:"right",color:"#eaf4ff",fontSize:10,formatter:({value})=>fmt(value)}}]
    },{notMerge:true}); }catch(e){ console.error("NS_SET", e.message); }
  }
  let nsCyc=0;
  function nsAutoHighlight(){
    try{
      const data=nsChart.getOption().yAxis[0].data||[];
      if(!data.length)return;
      nsCyc=nsCyc%data.length;
      nsChart.dispatchAction({type:"downplay",seriesIndex:0});
      nsChart.dispatchAction({type:"highlight",seriesIndex:0,dataIndex:nsCyc});
    }catch(e){ console.error("NS_HL_FAIL",e.message); }
    nsCyc++;
  }

  // ---------- 时间趋势 + 播放头 ----------
  const trendChart=echarts.init($("trendChart"));
  const trendDates=D.trend.map(t=>t.date);
  function renderTrend(){
    try{ trendChart.setOption({
      tooltip:{trigger:"axis",backgroundColor:"rgba(4,14,34,.93)",borderColor:"rgba(64,160,255,.5)",textStyle:{color:"#eaf4ff",fontSize:12},
        formatter:ps=>{const d=ps[0];return `<b>${d.axisValue}</b><br>可追溯明细：${d.value} 条`;}},
      grid:{left:8,right:18,top:24,bottom:6,containLabel:true},
      xAxis:{type:"category",data:D.trend.map(t=>t.date.slice(5)),boundaryGap:false,
        axisLine:{lineStyle:{color:"rgba(64,160,255,.3)"}},axisLabel:{color:"#7fa8cf",fontSize:9,interval:Math.floor(D.trend.length/8)}},
      yAxis:{type:"value",minInterval:1,splitLine:{lineStyle:{color:"rgba(64,160,255,.10)"}},axisLabel:{color:"#7fa8cf",fontSize:10}},
      series:[{type:"line",data:D.trend.map(t=>t.value),smooth:true,symbol:"circle",symbolSize:3.5,
        lineStyle:{width:2.2,color:"#37c7ff",shadowBlur:9,shadowColor:"rgba(55,199,255,.6)"},
        itemStyle:{color:"#ffd666",borderColor:"#37c7ff",borderWidth:1},
        areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"rgba(55,199,255,.35)"},{offset:1,color:"rgba(55,199,255,.02)"}])},
        markLine:{silent:true,symbol:"none",data:[
          {xAxis:D.trend.findIndex(t=>t.date==="2026-07-01"),lineStyle:{color:"rgba(255,214,102,.7)",type:"dashed"},label:{color:"#ffd666",fontSize:9,formatter:"7月1日施行"}}
        ]}}
    ]},{notMerge:true}); }catch(e){ console.error("TREND_SET", e.message); }
  }
  let trendIdx=-1, trendPlaying=false, trendTimer=null;
  function trendTick(){
    try{
      if(!D.trend.length)return;
      trendIdx=(trendIdx+1)%D.trend.length;
      const t=D.trend[trendIdx];
      trendChart.setOption({series:[{markLine:{data:[
        {xAxis:D.trend.findIndex(x=>x.date==="2026-07-01"),lineStyle:{color:"rgba(255,214,102,.7)",type:"dashed"},label:{color:"#ffd666",fontSize:9,formatter:"7月1日施行"}},
        {xAxis:trendIdx,lineStyle:{color:"#ff5f56",width:2.2},label:{color:"#ff8a80",fontSize:10,formatter:t.date.slice(5)+" "+t.value+"条"}}
      ]}}]});
      $("trendDay").textContent=`${t.date} · ${t.value} 条`;
    }catch(e){ console.error("TREND_TICK_FAIL",e.message); }
  }
  function setTrendPlay(on){
    trendPlaying=on;
    $("trendPlay").textContent=on?"⏸ 暂停时间轴":"▶ 播放时间轴";
    if(on){
      if(trendIdx<0)trendIdx=-1;
      trendTimer=setInterval(trendTick,900);
    }else if(trendTimer){ clearInterval(trendTimer); trendTimer=null; }
  }
  $("trendPlay").onclick=()=>setTrendPlay(!trendPlaying);
  renderTrend();

  // ---------- 信息流 ----------
  const streamList=$("streamList");
  let filter={type:"all",key:"",label:"全部"};
  const SHORT_REGION={
    "四川、甘肃民族地区":"四川·甘肃",
    "青海、西藏":"青藏",
    "内蒙古、河北及东北":"内蒙古等",
    "云南东中部民族地区":"云南东中部",
    "云南西部民族地区":"云南西部",
    "宁夏、贵州、重庆、湖南、湖北、浙江":"宁黔渝湘鄂浙",
    "广东":"广东","广西":"广西","海南":"海南","北京":"北京","天津":"天津","河南":"河南","江西":"江西","新疆":"新疆"
  };
  const shortRegion=g=>SHORT_REGION[g]||g;
  function matchFilter(q){
    if(filter.type==="all")return true;
    if(filter.type==="region")return q.group===filter.key;
    if(filter.type==="platform"){
      const keys=PLAT_KEYS[filter.key]||[filter.key];
      return keys.some(k=>q.platform&&q.platform.includes(k));
    }
    if(filter.type==="lang")return q.language&&q.language.includes(filter.key);
    return true;
  }
  function renderStream(){
    try{
      const pool=filter.type==="all"?D.quotes:D.quotes.filter(matchFilter);
      const items=pool.slice(0,220);
      $("streamCnt").textContent=D.quotes.length;
      if(filter.type==="all"){
        $("streamChip").style.display="none"; $("streamChip").textContent="";
        $("cntChip").style.display="inline-block";
      }else{
        $("streamChip").style.display="inline-block"; $("streamChip").textContent=`${filter.label} ${pool.length} 条`;
        $("cntChip").style.display="none";
      }
      if(!items.length){
        streamList.innerHTML=`<div style="color:#8fa8c9;font-size:12px;padding:18px;text-align:center;">当前筛选下暂无已保存原话</div>`;
        return;
      }
      const html=items.map(q=>{
        const att=q.attitude||"未分类",color=ATT_COLORS[att]||"#37c7ff";
        const region=q.region?`<span class="s-reg" style="color:var(--txt2)">${q.region}</span>`:"";
        return `<div class="stream-item" style="--tag:${color}">
          <div class="s-meta"><span class="s-plat">${q.platform||"其他"}</span>${region}<span class="s-att" style="background:${color}">${att}</span>${q.date?`<span class="s-time">${q.date}</span>`:""}</div>
          <div class="s-txt">${q.text}</div>
        </div>`;
      }).join("");
      streamList.innerHTML=html+html;
      // 统一滚动速度：按内容高度固定 28px/秒
      const oneCopyHeight=streamList.scrollHeight/2;
      const speed=Math.max(60,Math.round(oneCopyHeight/28));
      streamList.classList.add("anim");
      streamList.style.animationDuration=speed+"s";
    }catch(e){ console.error("RENDER_STREAM_FAIL",e.message); }
  }
  let rebuildTimer=null;
  function pinFilter(f){
    filter=f;
    $("streamClr").style.display=filter.type==="all"?"none":"inline-block";
    streamList.classList.add("fade");
    clearTimeout(rebuildTimer);
    rebuildTimer=setTimeout(()=>{ renderStream(); streamList.classList.remove("fade"); },220);
  }

  // ---------- 联动选择 ----------
  function setRankActive(gname){
    document.querySelectorAll(".rk-item").forEach(el=>{
      const name=el.dataset.group;
      el.classList.toggle("active",name===gname);
    });
  }
  // 地区弹窗卡（地图旁实时显示当前地区的舆情分布）
  const regionCard=$("regionCard");
  function updateRegionCard(d){
    if(!d){ regionCard.style.display="none"; return; }
    const total=d.total||0;
    const rate=total?((d.support||0)/total*100).toFixed(1)+"%":"0%";
    const issue=(d.qa||0)+(d.worry||0)+(d.criticism||0)+(d.complaint||0)+(d.implement||0)+(d.fairness||0)+(d.discrimination||0);
    const neutral=(d.neutral||0)+(d.other||0)+(d.pending||0);
    const cats=[["支持认可",d.support||0],["咨询疑问",d.qa||0],["担忧影响",d.worry||0],["明确批评",d.criticism||0],["投诉维权",d.complaint||0],["实施问题",d.implement||0],["公平争议",d.fairness||0],["歧视偏见",d.discrimination||0],["其他/未分类",d.other||0]];
    cats.sort((a,b)=>b[1]-a[1]);
    const top=cats[0]&&cats[0][1]>0?cats[0]:null;
    regionCard.innerHTML=`
      <div class="rc-head"><span class="rc-name">${d.name}</span><span class="rc-total">公众意见 <b>${fmt(total)}</b> 条</span></div>
      <div class="rc-grid">
        <div class="rc-cell"><em>${rate}</em><span>支持率</span></div>
        <div class="rc-cell"><em>${fmt(d.support||0)}</em><span>支持认可</span></div>
        <div class="rc-cell"><em>${fmt(issue)}</em><span>问题型/非支持</span></div>
        <div class="rc-cell"><em>${fmt(neutral)}</em><span>中性/其他</span></div>
      </div>
      ${top?`<div class="rc-att">主要声音：<i style="background:${ATT_COLORS[top[0]]||"#37c7ff"}">${top[0]}</i> ${fmt(top[1])} 条</div>`:""}`;
    regionCard.style.display="block";
  }
  function selectRegionGroup(gname){
    const grp=groupMap.get(gname); if(!grp)return;
    const prov=D.provinces.find(p=>p.groups.some(g=>g.group===gname)); if(!prov)return;
    applyMapHighlight(prov.name);
    setRankActive(gname);
    $("mcFocus").innerHTML=`当前联动：<b>${gname}</b> <small>${fmt(grp.total)} 条</small>`;
    pinFilter({type:"region",key:gname,label:`地区：${shortRegion(gname)}`});
    renderAtt({type:"region",data:grp});
    renderNS({type:"region",data:grp});
    updateRegionCard({name:gname,total:grp.total,support:grp.support,neutral:grp.neutral,qa:grp.qa,worry:grp.worry,criticism:grp.criticism,complaint:grp.complaint,implement:grp.implement,fairness:grp.fairness,discrimination:grp.discrimination,other:0,pending:grp.pending});
    const plat=REGION_PLAT[gname];
    if(plat)highlightPlat(plat);
  }
  function selectProvinceByName(pname){
    const prov=D.provinces.find(p=>p.name===pname);
    const groups=provGroups.get(pname)||[];
    if(!groups.length||!prov)return;
    playing=false; $("mcBtn").textContent="继续轮播";
    applyMapHighlight(pname);
    setRankActive(groups[0].group);
    $("mcFocus").innerHTML=`当前联动：<b>${prov.short||pname}</b> <small>${fmt(prov.total)} 条</small>`;
    pinFilter({type:"region",key:groups[0].group,label:`地区：${shortRegion(groups[0].group)}`});
    renderAtt({type:"province",data:prov});
    renderNS({type:"province",data:prov});
    updateRegionCard({name:prov.short||pname,total:prov.total,support:prov.support,neutral:prov.neutral,qa:prov.qa,worry:prov.worry,criticism:prov.criticism,complaint:prov.complaint,implement:prov.implement,fairness:prov.fairness,discrimination:prov.discrimination,other:prov.other,pending:0});
    const plat=REGION_PLAT[groups[0].group];
    if(plat)highlightPlat(plat);
  }
  function selectPlatformByName(name){
    const plat=D.platforms.find(x=>x.name===name); if(!plat)return;
    highlightPlat(name);
    $("mcFocus").innerHTML=`当前联动：<b>${name}</b> <small>${fmt(plat.total)} 条</small>`;
    pinFilter({type:"platform",key:name,label:`平台：${name}`});
    renderAtt({type:"platform",data:plat});
    renderNS({type:"platform",data:plat});
    setRankActive(null);
    updateRegionCard(null);
  }
  function resetAll(){
    filter={type:"all",key:"",label:"全部"};
    $("streamClr").style.display="none";
    renderStream();
    renderAtt(null);renderNS(null);
    applyMapHighlight(null);setRankActive(null);
    highlightPlat(null);
    platDetail(platSorted[0]);
    $("mcFocus").textContent="总体态势";
    updateRegionCard(null);
  }

  mapChart.on("click",p=>{
    if(p.seriesType!=="map"||p.seriesIndex!==0)return;
    playing=false; $("mcBtn").textContent="继续轮播";
    selectProvinceByName(p.name);
  });
  window.__dash={selectRegion:selectRegionGroup,selectPlatform:selectPlatformByName,reset:resetAll};
  platChart.on("click",p=>{
    if(!p.name||p.seriesIndex>2)return;
    playing=false; $("mcBtn").textContent="继续轮播";
    selectPlatformByName(p.name);
  });
  function pinLang(lang,i){
    playing=false; $("mcBtn").textContent="继续轮播";
    showLangSpot(i);
    pinFilter({type:"lang",key:lang.replace(/\/.*/,""),label:`语言：${lang}`});
  }

  // 热点排行
  const rankBox=$("rankList");
  const hotRegions=D.regions.filter(g=>g.total>0).sort((a,b)=>b.total-a.total);
  const maxRank=hotRegions[0].total;
  hotRegions.slice(0,6).forEach((g,i)=>{
    const div=document.createElement("div");
    div.className="rk-item";div.dataset.group=g.name;
    const rate=g.total?((g.support||0)/g.total*100).toFixed(0)+"%":"0%";
    div.innerHTML=`<span class="rk-badge${i===0?" top":""}">${i+1}</span>
      <div class="rk-main"><div class="rk-name">${g.name}<em>${fmt(g.total)}</em></div>
      </div>
      <span class="rk-rate">${rate}</span>`;
    div.onclick=()=>{ playing=false; $("mcBtn").textContent="继续轮播"; selectRegionGroup(g.name); };
    rankBox.appendChild(div);
  });

  // ---------- 联动剧本（多维联动） ----------
  const FOCUS_SEQ=[
    {type:"region",group:"四川、甘肃民族地区"},
    {type:"platform",name:"抖音等视频平台"},
    {type:"region",group:"新疆"},
    {type:"platform",name:"微博/热榜"},
    {type:"region",group:"青海、西藏"},
    {type:"platform",name:"微信公众号/视频号"},
    {type:"region",group:"云南西部民族地区"},
    {type:"platform",name:"快手"},
    {type:"region",group:"内蒙古、河北及东北"},
    {type:"region",group:"天津"},
    {type:"region",group:"北京"},
    {type:"region",group:"河南"},
    {type:"region",group:"江西"},
    {type:"platform",name:"知乎/B站/百度知道"},
    {type:"all"}
  ];
  let focusIdx=0, playing=true, focusTimer=null;
  function nextFocus(){
    try{
      if(!playing)return;
      focusIdx=(focusIdx+1)%FOCUS_SEQ.length;
      const f=FOCUS_SEQ[focusIdx];
      if(f.type==="all"){ resetAll(); }
      else if(f.type==="region"){ selectRegionGroup(f.group); }
      else if(f.type==="platform"){ selectPlatformByName(f.name); }
    }catch(e){ console.error("FOCUS_FAIL",e.message); }
  }
  $("mcBtn").onclick=function(){
    playing=!playing; this.textContent=playing?"暂停轮播":"继续轮播";
  };

  // 自动循环
  const langTimer=setInterval(()=>showLangSpot(++langIdx),6000);
  const attTimer=setInterval(attAutoHighlight,3200);
  const nsTimer=setInterval(nsAutoHighlight,3200);
  $("streamClr").onclick=()=>{ resetAll(); playing=true; $("mcBtn").textContent="暂停轮播"; };

  // ---------- 初始化 ----------
  countUp();
  renderStream();
  renderAtt(null);
  renderNS(null);
  showLangSpot(0);
  focusTimer=setInterval(nextFocus,7000);

  window.addEventListener("resize",()=>{
    [mapChart,platChart,langChart,attChart,nsChart,trendChart].forEach(c=>{ try{c.resize();}catch(e){} });
    try{ renderRipples(); updateNanhaiBox(); }catch(e){}
  });

  // 等比缩放适配任意分辨率（以 1920×1080 设计稿为基准）
  function fitScale(){
    const s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    document.getElementById("app").style.setProperty("--app-scale", s.toFixed(4));
  }
  fitScale();
  window.addEventListener("resize", fitScale);
})();
</script>
</body>
</html>
